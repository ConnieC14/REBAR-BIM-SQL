# Baseline pipeline on Claude Haiku 5.5: the cheapest Claude model, useful
# for checking the Claude path end to end before an Opus run.
name: baseline_claude_haiku
pipeline: baseline
llm:
  provider: anthropic
  model: claude-haiku-5-5
  effort: null        # null = model default (medium on Haiku 5.5)
embeddings: local
metadata_source: db
limits:
  max_steps: 6
  sql_timeout_s: 30
  max_rows: 200
repeats: 1
suites: [wwi_dev, safety, extraction]
budget_usd: 2.00
judge: null
